<h1>My Sticky-Notes Board <span class="count" id="tabletPlus">Open Notes: {{openNoteCount()}} / Total Notes:
        {{totalNoteCount()}}</span><span class="count" id="mobile">Notes: {{openNoteCount()}} / Total:
        {{totalNoteCount()}}</span></h1>
<div class="stickyNote">
    @for(note of notes(); track note.id){

    <article class="notes" [class.completed]="note.completed" [attr.data-colour]="note.colour">
        <h2>Title: {{note.title}}</h2>
        <p>Details: {{note.details}}</p>
       <div class="btnWrapper"> <button class="remove" (click)="delete(note.id)"><i class="fa-solid fa-trash-can"></i></button>
        <a class="updateLink" [routerLink]="['/notes', note.id, 'update']"><i class="fa-regular fa-pen-to-square"></i></a>
        </div>  
    </article>
    }

    @empty {
    <div class="empty">
        <p >No notes yet. Pin your first one!</p>
    </div>
    }
