<h1>My Sticky-Notes Board <span class="count">Open Tasks: {{openNoteCount()}} / Total Tasks: {{totalNoteCount()}}</span></h1>
<div class="stickyNote">
@for(note of notes(); track note.id){

<article class="notes" [class.completed]="note.completed" [attr.data-colour]="note.colour">
    <h2>Title: {{note.title}}</h2>
    <p>Details: {{note.details}}</p>     
</article>
}

@empty {
<p class="empty">No tasks yet. Pin your first one!</p>
}
