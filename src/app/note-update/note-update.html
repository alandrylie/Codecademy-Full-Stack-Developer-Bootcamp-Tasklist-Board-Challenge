<div id="formWrapper">

    <form id="updateForm" [formGroup]="updateForm" (ngSubmit)="onSubmit()" [attr.data-colour]="this.noteColour()">
         <label for="title">Task Title:</label>
        <input id="title" formControlName="title" placeholder="What task needs doing.">
        @if(updateForm.controls.title.touched && updateForm.controls.title.invalid){
        <p>The note title needs to be between 3 - 15 Characters.</p>
        }
        <label for="details">Details</label>
        <textarea id="details" rows="7" formControlName="details"
            placeholder="Detail exactly what needs done. Max Length 200 Characters"></textarea>
          @if(updateForm.controls.details.touched && updateForm.controls.details.invalid){
            <p>The note details needs to be 200 Characters or less.</p>
          }

        <label id="colour">Sticky Note Colour</label>
        <select id="colour" formControlName="colour">
            <option value="" disabled>Pick a Colour</option>
            <option value="pink">Pink</option>
            <option value="blue">Blue</option>
            <option value="green">Green</option>
            <option value="yellow">Yellow</option>
        </select>

        <button id="btnSubmit" type="submit" [disabled]="updateForm.invalid">Update Note</button>
    </form>

</div>
